services:
  postgres:
    image: postgres:16
    container_name: pos-postgres
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos_owner
      POSTGRES_PASSWORD: pos_owner_dev_password
    ports:
      - "5442:5432"
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_owner -d pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: pos-redis
    ports:
      - "6389:6379"
    volumes:
      - pos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos_postgres_data:
  pos_redis_data:
