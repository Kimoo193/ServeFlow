<main class="wrap">
  <form class="card connect-card" (ngSubmit)="connect()">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="word">Serve<span class="word-strong">Flow</span></span>
      <span class="badge badge--muted">Kitchen Display</span>
    </div>

    <p class="lead">Connect this screen to a station.</p>

    <div class="field">
      <label class="field-label" for="tenantId">Tenant ID</label>
      <input id="tenantId" class="input mono-input" name="tenantId" [ngModel]="tenantId()" (ngModelChange)="tenantId.set($event)"
             autocomplete="off" spellcheck="false" placeholder="00000000-0000-…" />
    </div>
    <div class="field">
      <label class="field-label" for="branchId">Branch ID</label>
      <input id="branchId" class="input mono-input" name="branchId" [ngModel]="branchId()" (ngModelChange)="branchId.set($event)"
             autocomplete="off" spellcheck="false" placeholder="00000000-0000-…" />
    </div>
    <div class="field">
      <label class="field-label" for="stationId">Station ID</label>
      <input id="stationId" class="input mono-input" name="stationId" [ngModel]="stationId()" (ngModelChange)="stationId.set($event)"
             autocomplete="off" spellcheck="false" placeholder="the station this screen shows" />
    </div>
    <div class="field">
      <label class="field-label" for="username">Username</label>
      <input id="username" class="input" name="username" [ngModel]="username()" (ngModelChange)="username.set($event)"
             autocomplete="username" spellcheck="false" placeholder="the kitchen account for this screen" />
    </div>
    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input id="password" class="input" name="password" type="password" [ngModel]="password()"
             (ngModelChange)="password.set($event)" autocomplete="current-password" />
    </div>

    @if (error()) {
      <p class="connect-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn connect-submit" [disabled]="busy()">
      {{ busy() ? 'Connecting…' : 'Open station board' }}
    </button>
  </form>
</main>
