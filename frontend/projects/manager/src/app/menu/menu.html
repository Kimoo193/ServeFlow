<header class="page-head">
  <h1 class="page-title">Menu</h1>
</header>

@if (error()) {
  <div class="banner banner--error" role="alert">
    <span>{{ error() }}</span>
    <button class="banner-dismiss" (click)="closeError()" aria-label="Dismiss">&times;</button>
  </div>
}

<div class="tabs" role="tablist">
  <button role="tab" [attr.aria-selected]="activeTab() === 'categories'" [class.active]="activeTab() === 'categories'" (click)="activeTab.set('categories')">
    Categories &amp; Items
  </button>
  <button role="tab" [attr.aria-selected]="activeTab() === 'modifiers'" [class.active]="activeTab() === 'modifiers'" (click)="activeTab.set('modifiers')">
    Modifier Groups
  </button>
  <button role="tab" [attr.aria-selected]="activeTab() === 'combos'" [class.active]="activeTab() === 'combos'" (click)="activeTab.set('combos')">
    Combos
  </button>
</div>

<div class="tab-content">
  @switch (activeTab()) {
    @case ('categories') {
      <app-category-panel [menuTree]="menuTree()" [stations]="stations()" (refresh)="refreshTree()" />
    }
    @case ('modifiers') {
      <app-modifier-library (refresh)="refreshTree()" />
    }
    @case ('combos') {
      <app-combo-panel [menuTree]="menuTree()" (refresh)="refreshTree()" />
    }
  }
</div>
