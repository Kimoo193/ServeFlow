<header class="page-head">
  <h1 class="page-title">Dashboard</h1>
  @if (summary(); as s) {
    <p class="page-sub">Today &middot; <span class="sf-mono">{{ s.date }}</span></p>
  }
</header>

@if (error()) {
  <div class="banner banner--error" role="alert">
    <span>{{ error() }}</span>
    <button class="banner-dismiss" (click)="closeError()" aria-label="Dismiss error">&times;</button>
  </div>
}

<div class="stats">
  @if (summary(); as s) {
    <div class="card stat-card">
      <div class="stat-value sf-mono">{{ s.ordersToday }}</div>
      <div class="stat-label">Orders today</div>
      <div class="stat-note">Placed since midnight (UTC)</div>
    </div>
    <div class="card stat-card">
      <div class="stat-value sf-mono">{{ s.openNow }}</div>
      <div class="stat-label">Open now</div>
      <div class="stat-note">Awaiting service or payment</div>
    </div>
  } @else if (!error()) {
    <div class="card stat-card" aria-hidden="true">
      <div class="skeleton skeleton--line" style="inline-size: 3ch; block-size: 2.6rem;"></div>
      <div class="skeleton skeleton--line" style="inline-size: 8ch;"></div>
    </div>
    <div class="card stat-card" aria-hidden="true">
      <div class="skeleton skeleton--line" style="inline-size: 3ch; block-size: 2.6rem;"></div>
      <div class="skeleton skeleton--line" style="inline-size: 8ch;"></div>
    </div>
  }
</div>
