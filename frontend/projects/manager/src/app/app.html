@if (session.isConnected()) {
  <div class="shell">
    <nav class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="word">ServeFlow</span>
        <span class="role">Manager</span>
      </div>
      <a class="nav-link" routerLink="/menu" routerLinkActive="active" aria-current="page">Menu</a>
      <button class="disconnect" (click)="disconnect()">Disconnect</button>
    </nav>
    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
