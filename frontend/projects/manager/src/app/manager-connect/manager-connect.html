<main class="wrap">
  <form class="card connect-card" (ngSubmit)="connect()">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="word">ServeFlow</span>
      <span class="badge badge--muted">Manager</span>
    </div>

    <p class="lead">Connect to configure the menu, floor, and staff.</p>

    <div class="field">
      <label class="field-label" for="tenantId">Tenant ID</label>
      <input id="tenantId" class="input mono-input" name="tenantId" [ngModel]="tenantId()" (ngModelChange)="tenantId.set($event)"
             autocomplete="off" spellcheck="false" placeholder="00000000-0000-…" />
    </div>
    <div class="field">
      <label class="field-label" for="branchId">Branch ID</label>
      <input id="branchId" class="input mono-input" name="branchId" [ngModel]="branchId()" (ngModelChange)="branchId.set($event)"
             autocomplete="off" spellcheck="false" placeholder="00000000-0000-…" />
    </div>
    <div class="field">
      <label class="field-label" for="userId">User ID</label>
      <input id="userId" class="input mono-input" name="userId" [ngModel]="userId()" (ngModelChange)="userId.set($event)"
             autocomplete="off" spellcheck="false" placeholder="staff id for menu changes" />
    </div>

    @if (error()) {
      <p class="connect-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary connect-submit" [disabled]="busy()">
      {{ busy() ? 'Connecting…' : 'Open manager desk' }}
    </button>
  </form>
</main>
